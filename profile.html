<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homepage | Zhao Guojiao</title>
  <meta name="description" content="简洁的个人名片页：名字、学校、专业、联系方式。" />
  <style>
    :root{--bg:#0b1020;--card:#121a2e;--text:#e8eefc;--muted:#aab7d4;--acc:#6aa8ff}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0b1020,#0a0f1c 40%,#070b13);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(860px,92vw);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35);padding:28px}
    .row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
    .avatar{flex:0 0 96px;height:96px;border-radius:18px;background:linear-gradient(135deg,#6aa8ff,#9ee8ff);display:grid;place-items:center;font-weight:800;color:#0a0f1c;font-size:36px}
    h1{margin:0;font-size:28px}
    .subtitle{color:var(--muted);margin-top:6px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    .item{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;background:rgba(255,255,255,.02)}
    .item b{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
    .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:12px;color:var(--text);text-decoration:none}
    .btn:hover{border-color:rgba(255,255,255,.3)}
    footer{margin-top:22px;color:var(--muted);font-size:12px}
    @media (max-width:640px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <section class="row">
      <div class="avatar" id="avatar">ZHAO Guojiao</div>
      <div>
        <h1 id="name">Zhao Guojiao</h1>
        <div class="subtitle" id="tagline">Shanghai Jiao Tong University · Electrical and Computer Engineering · 2023–2027</div>
        <div class="links">
          <a class="btn" id="emailLink" href="zgj_1.17@sjtu.edu.cn">📧 Email</a>
          <a class="btn" id="githubLink" href="#" target="_blank" rel="noopener">🐙 GitHub</a>
          
        </div>
      </div>
    </section>

    <section class="grid" style="margin-top:20px">
      <div class="item"><b>学校 / School</b><div id="school">填写你的学校</div></div>
      <div class="item"><b>专业 / Major</b><div id="major">填写你的专业</div></div>
      <div class="item"><b>所在城市 / Location</b><div id="location">Tokyo, JP</div></div>
      <div class="item"><b>一句话介绍 / About</b><div id="about">对自己的研究或方向的简短描述。</div></div>
    </section>

    <footer>© <span id="year"></span> <span id="nameCopy">你的名字</span>. All rights reserved.</footer>
  </main>

  <script>
    // —— 只改这一段数据即可 ——
    const data = {
      name: "Zhao Guojiao",
      initials: "Z",
      school: "Shanghai Jiao Tong University",
      major: "Electrical and Computer Engineering",
      yearText: "2023–2027",
      location: "Shanghai, CN",
      about: "A passionate student interested in Recommender Systems, AI jailbreaking, and machine learning.",
      links: {
        email: "zgj_1.17@sjtu.edu.cn",
        github: "https://github.com/CatGPT-Zoe",
        
      }
    };

    // —— 渲染 ——
    const $ = id => document.getElementById(id);
    $("name").textContent = data.name;
    $("nameCopy").textContent = data.name;
    $("avatar").textContent = (data.initials || data.name[0] || "").slice(0,2);
    $("tagline").textContent = `${data.school} · ${data.major} · ${data.yearText}`;
    $("school").textContent = data.school;
    $("major").textContent = data.major;
    $("location").textContent = data.location;
    $("about").textContent = data.about;

    const email = data.links.email ? `mailto:${data.links.email}` : "#";
    const gh = data.links.github || "#";
    const cv = data.links.cv || "#";

    const emailLink = document.getElementById("emailLink");
    emailLink.href = email;
    const ghLink = document.getElementById("githubLink");
    ghLink.href = gh;
    const cvLink = document.getElementById("cvLink");
    cvLink.href = cv;

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
